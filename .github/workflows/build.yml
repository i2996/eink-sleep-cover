name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace
          cp app/build/outputs/apk/release/app-release.apk eink-sleep-cover.apk

      - uses: actions/upload-artifact@v4
        with:
          name: eink-sleep-cover-apk
          path: eink-sleep-cover.apk

      - name: Publish "latest" release
        if: github.ref_name == github.event.repository.default_branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 릴리스·태그를 지웠다 다시 만들면, 태그 삭제가 늦게 처리될 때 새 릴리스가
          # 초안(draft)으로 되돌아가는 일이 있었다. 그래서 지우지 않고 같은 릴리스를 갱신한다.
          git tag -f latest "${{ github.sha }}"
          git push -f origin refs/tags/latest
          if ! gh release view latest >/dev/null 2>&1; then
            gh release create latest --title "최신 빌드" --notes "기기 브라우저에서 eink-sleep-cover.apk 를 받아 설치하세요."
          fi
          gh release upload latest eink-sleep-cover.apk --clobber
          gh release edit latest --title "최신 빌드 #${{ github.run_number }}" --draft=false --latest
          sleep 5
          # 기기가 실제로 받을 수 있는지 확인 (로그인 없이, 제목의 빌드 번호까지)
          for i in 1 2 3 4 5 6; do
            name=$(curl -s "https://api.github.com/repos/${{ github.repository }}/releases/latest" | grep -o '"name": *"최신 빌드 #[0-9]*"' || true)
            echo "$name" | grep -q "#${{ github.run_number }}\"" && break
            sleep 10
          done
          echo "public release check: $name"
          echo "$name" | grep -q "#${{ github.run_number }}\""
