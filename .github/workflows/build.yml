name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace
          cp app/build/outputs/apk/release/app-release.apk eink-sleep-cover.apk

      - uses: actions/upload-artifact@v4
        with:
          name: eink-sleep-cover-apk
          path: eink-sleep-cover.apk

      - name: Publish "latest" release
        if: github.ref_name == github.event.repository.default_branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest eink-sleep-cover.apk \
            --target "${{ github.sha }}" \
            --title "최신 빌드 #${{ github.run_number }}" \
            --notes "기기 브라우저에서 eink-sleep-cover.apk 를 받아 설치하세요."
