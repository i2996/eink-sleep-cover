name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace
          cp app/build/outputs/apk/release/app-release.apk eink-sleep-cover.apk

      - uses: actions/upload-artifact@v4
        with:
          name: eink-sleep-cover-apk
          path: eink-sleep-cover.apk

      - name: Publish "latest" release
        if: github.ref_name == github.event.repository.default_branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest eink-sleep-cover.apk \
            --target "${{ github.sha }}" \
            --title "최신 빌드 #${{ github.run_number }}" \
            --notes "기기 브라우저에서 eink-sleep-cover.apk 를 받아 설치하세요."
          # gh가 초안(draft)으로 남겨 두는 경우가 있어 확실히 공개한다.
          gh release edit latest --draft=false --latest
          # 기기가 실제로 받을 수 있는지 확인 (로그인 없이)
          for i in 1 2 3 4 5; do
            code=$(curl -s -o /dev/null -w "%{http_code}" "https://api.github.com/repos/${{ github.repository }}/releases/latest")
            [ "$code" = "200" ] && break
            sleep 5
          done
          echo "public release check: $code"
          [ "$code" = "200" ]
